name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install Capacitor deps
        working-directory: app/mobile
        run: npm ci

      - name: Add Android platform
        working-directory: app/mobile
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: app/mobile
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/mobile/android/app/release.keystore

      - name: Create signing config
        run: |
          cat > app/mobile/android/signing.properties <<EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Release APK
        working-directory: app/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: List APK outputs
        working-directory: app/mobile/android
        run: find . -name "*.apk" -type f 2>/dev/null | head -20

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: pointinscript-release-apk
          path: app/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30