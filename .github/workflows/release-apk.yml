name: Build & Release APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v4-${{ hashFiles('app/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-v4-

      - name: Install Capacitor deps
        working-directory: app/mobile
        run: npm ci

      - name: Sync Capacitor (android/ est committé)
        working-directory: app/mobile
        run: npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          # Write to temp file to avoid shell expansion issues
          printf "%s" "$KEYSTORE_BASE64" > keystore.b64
          # Remove any potential whitespace or quotes and decode
          cat keystore.b64 | tr -d '\n\r "' | base64 -d > app/mobile/android/app/release.keystore
          rm keystore.b64

      - name: Keystore Diagnostic
        run: |
          echo "=== File Type ==="
          file app/mobile/android/app/release.keystore
          echo "=== File Size ==="
          ls -l app/mobile/android/app/release.keystore
          echo "=== First 16 bytes (Hex) ==="
          head -c 16 app/mobile/android/app/release.keystore | xxd -g 1 || echo "xxd not available"

      - name: Verify keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Error: One or more signing secrets are empty"
            exit 1
          fi
          echo "=== Keytool verify ==="
          keytool -list -v -keystore app/mobile/android/app/release.keystore -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS"

      - name: Create signing config
        working-directory: app/mobile/android
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf "storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > app/signing.properties

      - name: Build Release APK
        working-directory: app/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: List APK outputs
        working-directory: app/mobile/android
        run: find . -name "*.apk" -type f 2>/dev/null | head -20

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pointinscript-release-apk
          path: app/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create/Update GitHub Release (tags v*)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: app/mobile/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update "Latest" Release (push main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            **Build automatique depuis `main`** — ${{ github.sha }}
            
            APK release signé, prêt à installer.
            
            _Mis à jour à chaque push sur `main`._
          files: app/mobile/android/app/build/outputs/apk/release/*.apk
          make_latest: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
